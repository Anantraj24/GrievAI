services:
  # FastAPI Backend Web Service
  - type: web
    name: grievai-backend
    env: python
    region: singapore
    plan: free
    branch: main
    rootDir: backend
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && gunicorn -w 2 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: GROQ_API_KEY
        sync: false

  # React Frontend Static Site
  - type: web
    name: grievai-frontend
    env: static
    region: singapore
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: grievai-backend
          property: host
