<div class="flex flex-col items-center text-center space-y-stack-lg relative z-10">

<p class="font-body-md text-body-md text-on-surface-variant max-w-sm mx-auto">

                    </p>
</div>

<div class="w-full max-w-md mx-auto text-left space-y-stack-md mt-stack-lg">
<!-- Step 1: Completed -->
<div class="flex items-center gap-gutter">
<div class="w-8 h-8 rounded-full bg-primary/10 border border-primary/30 flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-primary text-[18px]">check</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Complaint received</span>
</div>
<!-- Step 2: Active -->
<div class="flex items-center gap-gutter relative">
<div class="absolute -left-[1px] top-0 bottom-0 w-[2px] bg-outline-variant -z-10 translate-x-4 -translate-y-4 h-8"></div>
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center flex-shrink-0 pulse-ring shadow-[0_0_12px_rgba(77,142,255,0.4)]">

</div>
<span class="font-body-lg text-body-lg text-primary font-medium">Understanding grievance</span>
</div>
