<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Submit Grievance</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap');
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#272a31",
                        "inverse-primary": "#005ac2",
                        "on-primary-fixed-variant": "#004395",
                        "on-background": "#e1e2eb",
                        "tertiary-fixed-dim": "#c3c6d1",
                        "outline": "#8c909f",
                        "on-secondary": "#2d3037",
                        "on-tertiary-fixed": "#181c23",
                        "surface-tint": "#adc6ff",
                        "secondary-fixed-dim": "#c4c6ce",
                        "on-secondary-container": "#b6b8c0",
                        "secondary": "#c4c6ce",
                        "secondary-fixed": "#e1e2ea",
                        "on-secondary-fixed": "#191c22",
                        "primary-fixed": "#d8e2ff",
                        "outline-variant": "#424754",
                        "on-primary-fixed": "#001a42",
                        "tertiary": "#c3c6d1",
                        "inverse-surface": "#e1e2eb",
                        "surface-bright": "#363940",
                        "background": "#10131a",
                        "primary": "#adc6ff",
                        "tertiary-container": "#8d919a",
                        "on-primary-container": "#00285d",
                        "on-error": "#690005",
                        "on-tertiary-fixed-variant": "#43474f",
                        "on-secondary-fixed-variant": "#44474d",
                        "secondary-container": "#464950",
                        "surface": "#10131a",
                        "on-error-container": "#ffdad6",
                        "surface-container-lowest": "#0b0e14",
                        "error-container": "#93000a",
                        "primary-container": "#4d8eff",
                        "inverse-on-surface": "#2e3037",
                        "tertiary-fixed": "#dfe2ed",
                        "on-surface": "#e1e2eb",
                        "on-primary": "#002e6a",
                        "primary-fixed-dim": "#adc6ff",
                        "error": "#ffb4ab",
                        "surface-container-low": "#191c22",
                        "on-surface-variant": "#c2c6d6",
                        "surface-dim": "#10131a",
                        "surface-variant": "#32353c",
                        "surface-container-highest": "#32353c",
                        "on-tertiary": "#2c3038",
                        "on-tertiary-container": "#262a32",
                        "surface-container": "#1d2026"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "stack-md": "16px",
                        "container-padding": "24px",
                        "unit": "4px",
                        "stack-sm": "8px",
                        "stack-lg": "32px"
                    },
                    "fontFamily": {
                        "headline-md": ["Geist"],
                        "display-lg": ["Geist"],
                        "body-md": ["Geist"],
                        "body-lg": ["Geist"],
                        "headline-lg-mobile": ["Geist"],
                        "headline-lg": ["Geist"],
                        "label-md": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md antialiased overflow-x-hidden flex flex-col items-center justify-center p-gutter">
<!-- Focused Canvas for Submission -->
<main class="w-full max-w-3xl flex flex-col gap-stack-lg">
<!-- Header -->
<header class="text-center">
<h1 class="font-display-lg text-display-lg text-on-surface mb-stack-sm">Tell us what happened?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xl mx-auto">Please provide detailed information to help us resolve the issue efficiently.</p>
</header>
<!-- Form Card -->
<form class="bg-[#1A1D23] border border-[#2D3139] rounded-lg p-container-padding flex flex-col gap-stack-md relative z-10">
<!-- Natural Language Textarea -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="grievance-description">Describe your issue</label>
<textarea class="bg-[#1A1D23] border border-[#2D3139] text-on-surface font-body-lg text-body-lg rounded-md p-gutter focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all resize-none placeholder-outline" id="grievance-description" placeholder="E.g., The main water pipe in block C has been leaking since yesterday morning..." rows="6"></textarea>
</div>
<!-- Contextual Details Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="grievance-category">Category (Optional)</label>
<select class="bg-[#1A1D23] border border-[#2D3139] text-on-surface font-body-md text-body-md rounded-md p-unit h-12 px-gutter focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all appearance-none cursor-pointer" id="grievance-category">
<option disabled="" selected="" value="">Select category</option>
<option value="maintenance">Maintenance</option>
<option value="safety">Safety &amp; Security</option>
<option value="facilities">Facilities</option>
<option value="other">Other</option>
</select>
</div>
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="grievance-location">Location (Optional)</label>
<select class="bg-[#1A1D23] border border-[#2D3139] text-on-surface font-body-md text-body-md rounded-md p-unit h-12 px-gutter focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all appearance-none cursor-pointer" id="grievance-location">
<option disabled="" selected="" value="">Select location</option>
<option value="block-a">Block A</option>
<option value="block-b">Block B</option>
<option value="block-c">Block C</option>
<option value="common">Common Area</option>
</select>
</div>
</div>
<!-- Evidence Upload -->
<div class="flex flex-col gap-stack-sm mt-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Evidence &amp; Attachments</label>
<div class="border-2 border-dashed border-[#2D3139] rounded-lg p-container-padding flex flex-col items-center justify-center text-center gap-stack-sm bg-surface/50 hover:bg-surface-container-high/30 transition-colors cursor-pointer group">
<span class="material-symbols-outlined text-4xl text-on-surface-variant group-hover:text-primary transition-colors" data-icon="cloud_upload">cloud_upload</span>
<div>
<p class="font-body-lg text-body-lg text-on-surface">Drag and drop files here, or click to browse</p>
<p class="font-body-md text-body-md text-outline">Supported formats: JPG, PNG, PDF (Max 10MB)</p>
</div>
</div>
<!-- Attached Files Preview (Example) -->
<div class="mt-stack-sm flex flex-col gap-unit">
<p class="font-label-md text-label-md text-on-surface-variant">Attached Files (1)</p>
<div class="flex items-center justify-between p-gutter bg-surface-container-low border border-[#2D3139] rounded-md">
<div class="flex items-center gap-gutter">
<div class="w-12 h-12 rounded overflow-hidden flex-shrink-0 border border-[#2D3139]">
<img alt="Evidence preview" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1UbaN0UvoVl_B0hB_VA4z4wp6iJwCzqqlEiBQ5urOHbEzf558yoy58IF-DBYPdKoipBv5QvWeqoqmS6PyyHSSfsXAaIXUDYmtB-X8sHoGjL66tpBc_QyRALVsOI-rLQrmeubcsUDifqE4mLC21lV2BSxvQqz1qRUOYNw5euTdJ_8kU7715MFzN1ALhd1wEMXTMJZn5QadJ4iVZINCto7CDr4Vi6vG19V5kFBqy_AR2nCxxWrqoZTdTSG9U"/>
</div>
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface truncate max-w-[200px] md:max-w-xs">IMG_20231025_0915.jpg</span>
<span class="font-label-md text-label-md text-outline">2.4 MB</span>
</div>
</div>
<button class="text-on-surface-variant hover:text-error transition-colors p-unit rounded-full hover:bg-surface-container-highest" type="button">
<span class="material-symbols-outlined text-xl" data-icon="delete">delete</span>
</button>
</div>
</div>
</div>
<!-- Actions -->
<div class="flex items-center justify-end gap-gutter mt-stack-md pt-stack-md border-t border-[#2D3139]">
<button class="px-6 py-3 font-body-lg text-body-lg font-medium text-on-surface hover:text-primary hover:bg-surface-container-high transition-colors rounded-md" type="button">Cancel</button>
<button class="bg-[#3B82F6] text-white px-8 py-3 rounded-md font-body-lg text-body-lg font-medium hover:bg-[#2563EB] transition-colors shadow-[0_0_15px_rgba(59,130,246,0.3)] hover:shadow-[0_0_20px_rgba(59,130,246,0.5)]" type="submit">Submit Grievance</button>
</div>
</form>
</main>
<!-- Background Atmospheric Effect -->
<div class="fixed inset-0 pointer-events-none z-0" style="background: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.05) 0%, transparent 60%);"></div>
</body></html>
