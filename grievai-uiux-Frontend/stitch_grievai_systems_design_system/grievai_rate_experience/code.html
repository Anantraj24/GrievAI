<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GrievAI - Student Feedback</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#10131a",
                        "secondary-fixed": "#e1e2ea",
                        "on-surface": "#e1e2eb",
                        "tertiary-fixed": "#dfe2ed",
                        "tertiary-fixed-dim": "#c3c6d1",
                        "surface-container-low": "#191c22",
                        "tertiary": "#c3c6d1",
                        "error-container": "#93000a",
                        "on-secondary-container": "#b6b8c0",
                        "surface-bright": "#363940",
                        "on-surface-variant": "#c2c6d6",
                        "on-primary-fixed-variant": "#004395",
                        "surface-tint": "#adc6ff",
                        "outline": "#8c909f",
                        "inverse-on-surface": "#2e3037",
                        "inverse-primary": "#005ac2",
                        "surface-container-high": "#272a31",
                        "surface-variant": "#32353c",
                        "surface-dim": "#10131a",
                        "on-tertiary": "#2c3038",
                        "inverse-surface": "#e1e2eb",
                        "surface-container-lowest": "#0b0e14",
                        "primary": "#adc6ff",
                        "surface-container-highest": "#32353c",
                        "on-tertiary-fixed-variant": "#43474f",
                        "on-tertiary-fixed": "#181c23",
                        "surface-container": "#1d2026",
                        "secondary-fixed-dim": "#c4c6ce",
                        "on-tertiary-container": "#262a32",
                        "outline-variant": "#424754",
                        "primary-fixed-dim": "#adc6ff",
                        "primary-fixed": "#d8e2ff",
                        "on-primary-fixed": "#001a42",
                        "background": "#10131a",
                        "on-primary-container": "#00285d",
                        "on-secondary": "#2d3037",
                        "primary-container": "#4d8eff",
                        "secondary-container": "#464950",
                        "on-error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#44474d",
                        "error": "#ffb4ab",
                        "on-background": "#e1e2eb",
                        "on-secondary-fixed": "#191c22",
                        "on-error": "#690005",
                        "tertiary-container": "#8d919a",
                        "on-primary": "#002e6a",
                        "secondary": "#c4c6ce"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "unit": "4px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "stack-lg": "32px",
                        "container-padding": "24px"
                    },
                    "fontFamily": {
                        "display-lg": ["Geist"],
                        "body-md": ["Geist"],
                        "headline-md": ["Geist"],
                        "headline-lg": ["Geist"],
                        "label-md": ["JetBrains Mono"],
                        "headline-lg-mobile": ["Geist"],
                        "body-lg": ["Geist"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
<style>
        .star-rating .material-symbols-outlined {
            font-variation-settings: 'FILL' 0;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .star-rating .material-symbols-outlined:hover,
        .star-rating .material-symbols-outlined.active {
            font-variation-settings: 'FILL' 1;
            color: #adc6ff;
            transform: scale(1.1);
        }
        /* Hide nav shell on this transactional screen as per Semantic Shell Mandate */
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-gutter">
<!-- Main Content Canvas -->
<main class="w-full max-w-2xl relative">
<!-- Background Atmospheric Element (Subtle) -->
<div class="absolute inset-0 bg-gradient-to-b from-primary/5 to-transparent rounded-xl pointer-events-none -z-10 blur-3xl opacity-50"></div>
<!-- Feedback Form Container -->
<div class="bg-surface border border-surface-variant rounded-xl p-container-padding shadow-2xl shadow-black/50 transition-all duration-500 transform translate-y-0 opacity-100" id="feedback-form">
<!-- Header -->
<div class="text-center mb-stack-lg">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container/20 text-primary mb-stack-md">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">task_alt</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-stack-sm">Grievance Resolved</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">How was your grievance handled?</p>
</div>
<!-- Rating Component -->
<div class="flex justify-center mb-stack-lg">
<div class="star-rating flex gap-unit" id="star-container">
<span class="material-symbols-outlined text-4xl text-surface-variant" data-value="1">star</span>
<span class="material-symbols-outlined text-4xl text-surface-variant" data-value="2">star</span>
<span class="material-symbols-outlined text-4xl text-surface-variant" data-value="3">star</span>
<span class="material-symbols-outlined text-4xl text-surface-variant" data-value="4">star</span>
<span class="material-symbols-outlined text-4xl text-surface-variant" data-value="5">star</span>
</div>
</div>
<!-- Text Area -->
<div class="mb-stack-lg">
<label class="block font-label-md text-label-md text-on-surface-variant mb-stack-sm" for="comments">ADDITIONAL COMMENTS (OPTIONAL)</label>
<textarea class="w-full bg-surface-container-low border border-surface-variant rounded-lg p-stack-md font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/20 transition-colors resize-none placeholder:text-outline" id="comments" placeholder="Tell us more about your experience..." rows="4"></textarea>
</div>
<!-- Actions -->
<div class="flex justify-end gap-stack-md">
<button class="px-stack-md py-stack-sm border border-surface-variant rounded-lg font-label-md text-label-md text-on-surface hover:bg-surface-container-high transition-colors" type="button">Skip</button>
<button class="px-stack-lg py-stack-sm bg-primary text-[#001a42] rounded-lg font-label-md text-label-md hover:bg-primary/90 transition-colors shadow-lg shadow-primary/20" disabled="" id="submit-btn" type="button">Submit Feedback</button>
</div>
</div>
<!-- Success State Container (Initially Hidden) -->
<div class="hidden absolute inset-0 bg-surface border border-surface-variant rounded-xl p-container-padding flex-col items-center justify-center text-center transition-all duration-500 transform translate-y-4 opacity-0" id="success-state">
<div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-primary-container/20 text-primary mb-stack-lg animate-pulse">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-stack-sm">Thank You</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-stack-lg">Your feedback helps us improve the grievance resolution process.</p>
<button class="px-stack-lg py-stack-sm border border-surface-variant rounded-lg font-label-md text-label-md text-on-surface hover:bg-surface-container-high transition-colors inline-flex items-center gap-unit" onclick="window.location.reload()" type="button">
<span class="material-symbols-outlined text-sm">arrow_back</span>
                Back to Dashboard
            </button>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const stars = document.querySelectorAll('.star-rating .material-symbols-outlined');
            const submitBtn = document.getElementById('submit-btn');
            const formContainer = document.getElementById('feedback-form');
            const successContainer = document.getElementById('success-state');
            let selectedRating = 0;

            // Star Rating Logic
            stars.forEach(star => {
                star.addEventListener('mouseover', function() {
                    const value = this.getAttribute('data-value');
                    highlightStars(value);
                });

                star.addEventListener('mouseout', function() {
                    highlightStars(selectedRating);
                });

                star.addEventListener('click', function() {
                    selectedRating = this.getAttribute('data-value');
                    highlightStars(selectedRating);
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                });
            });

            function highlightStars(count) {
                stars.forEach(star => {
                    if (star.getAttribute('data-value') <= count) {
                        star.classList.add('active');
                        star.classList.remove('text-surface-variant');
                    } else {
                        star.classList.remove('active');
                        star.classList.add('text-surface-variant');
                    }
                });
            }

            // Initial button state
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');

            // Submit Action
            submitBtn.addEventListener('click', () => {
                if(selectedRating > 0) {
                    // Transition to success state
                    formContainer.classList.add('-translate-y-4', 'opacity-0', 'pointer-events-none');
                    setTimeout(() => {
                        formContainer.classList.add('hidden');
                        successContainer.classList.remove('hidden');
                        // Small delay to allow display:block to apply before animating opacity
                        setTimeout(() => {
                            successContainer.classList.remove('translate-y-4', 'opacity-0');
                            successContainer.classList.add('translate-y-0', 'opacity-100');
                        }, 50);
                    }, 500);
                }
            });
        });
    </script>
</body></html>
